<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <!-- Defer ensures the script runs after the HTML is fully parsed -->
    <script src="api.js" defer></script>
</head>
<body>
    <main class="container">
        <header>
            <h1>QuickNotes</h1>
            <p class="subtitle">Load, create, and delete notes using a REST API.</p>
        </header>

        <section class="controls">
            <button id="load-btn" class="btn btn-primary">Load notes</button>
            <p id="status" class="status-message" aria-live="polite"></p>
        </section>

        <section class="create-note">
            <h2>Create a New Note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="title-input">Title (Required, max 100 characters)</label>
                    <input type="text" id="title-input" name="title" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label for="body-input">Body (Optional)</label>
                    <textarea id="body-input" name="body" rows="4"></textarea>
                </div>
                <button type="submit" id="submit-btn" class="btn btn-success">Create Note</button>
            </form>
        </section>

        <section class="notes-section">
            <h2>Your Notes</h2>
            <!-- The list is initially empty and populated by JavaScript -->
            <ul id="notes-list"></ul>
        </section>
    </main>
</body>
</html>
